name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two deploys at once would race on the same compose project.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      # No API credentials are set, so the fake implementations are the ones wired up.
      - run: dotnet test --no-build -c Release

  build:
    name: Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercases the image name, which GHCR requires.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache, so a code-only change skips the NuGet restore.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Production
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Pull and restart on the VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /srv/italian-app
            git pull --ff-only
            docker compose -f docker-compose.prod.yml pull api
            docker compose -f docker-compose.prod.yml up -d --no-build --remove-orphans

            # Fail the deploy loudly rather than leaving a broken container running.
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:8081/health > /dev/null; then
                echo "Health check passed."
                exit 0
              fi
              sleep 3
            done

            echo "Health check failed after 60s."
            docker compose -f docker-compose.prod.yml logs api --tail=50
            exit 1

      - name: Prune old images
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: docker image prune -f
