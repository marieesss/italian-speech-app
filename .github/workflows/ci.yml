name: CI

# Pushes to main are covered by the Deploy workflow, which runs the same tests first.
on:
  pull_request:

jobs:
  api:
    name: API (.NET)
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      # No API credentials are set, so the fake implementations are the ones wired up.
      - run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"
