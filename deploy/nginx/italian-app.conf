# Copy to /etc/nginx/sites-available/italian-app on the VPS, then symlink into
# sites-enabled. Replace DOMAIN and API_PORT. certbot rewrites this file to add TLS.
#
# Single origin: the React build is served from disk, /api and /audio are proxied to
# Kestrel. No CORS, one microphone grant, one certificate.
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    # Attempt audio is posted as a body; the default 1m is too tight.
    client_max_body_size 25m;

    root /srv/italian-app/web;
    index index.html;

    access_log /var/log/nginx/italian-app.access.log;
    error_log  /var/log/nginx/italian-app.error.log;

    # Inherited by every location below that proxies.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Scoring waits on Azure Speech; the 60s default is not always enough.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location /api/ {
        proxy_pass http://127.0.0.1:API_PORT;
    }

    location = /health {
        proxy_pass http://127.0.0.1:API_PORT;
        access_log off;
    }

    # Model MP3s, served by Kestrel from the mounted volume.
    location /audio/ {
        proxy_pass http://127.0.0.1:API_PORT;
    }

    # Vite emits content-hashed filenames here, so they can never go stale.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # A cached service worker would pin the app to an old version.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing: unknown paths are React routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html =404;
    }
}
